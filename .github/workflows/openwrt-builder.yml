name: Build WR30U ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: '选择源码分支'
        required: true
        default: 'chasey-25.12'
        type: choice
        options:
          - chasey-25.12

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install build-essential libncurses5-dev gawk git libssl-dev zlib1g-dev wget curl python3 python3-pip rsync unzip

      - name: Clone source code
        run: |
          # 直接指向 chasey-dev 的 25.12 分支
          git clone -q --single-branch --depth=1 --branch=25.12 https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git openwrt
          echo "源码克隆完成"

      - name: Load custom configuration
        run: |
          # 确保路径与你仓库中的配置文件路径一致
          cp config/chasey-25.12/config openwrt/.config

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download package
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: Verify config (检查核心组件是否生效)
        run: |
          cd openwrt
          echo "========== 检查最终生成的 .config =========="
          if grep -q "CONFIG_PACKAGE_luci-theme-argon=y" .config; then 
            echo "✅ 成功：Argon 主题已包含！"
          else 
            echo "❌ 失败：Argon 主题被系统剔除了！"
            exit 1
          fi
          if grep -q "CONFIG_PACKAGE_kmod-mt_wifi=y" .config; then 
            echo "✅ 成功：MTK 闭源驱动已包含！"
          else 
            echo "❌ 失败：MTK 驱动缺失！"
            exit 1
          fi
          if grep -q "CONFIG_PACKAGE_kmod-macvlan=y" .config; then 
            echo "✅ 成功：多拨底层依赖已包含！"
          else 
            echo "❌ 失败：多拨依赖缺失！"
            exit 1
          fi
          echo "=========================================="

      - name: Compile the OpenWrt
        id: compile
        run: |
          cd openwrt
          echo "开始编译，使用多线程..."
          make -j$(($(nproc) + 1)) V=s || make -j1 V=s
          echo "编译完成"

      - name: Check firmware
        run: |
          ls -lh openwrt/bin/targets/*/*/
          if ! ls openwrt/bin/targets/*/*/*.itb openwrt/bin/targets/*/*/*.bin 2>/dev/null; then
            echo "🚨 编译失败：没有生成 .itb 或 .bin 固件文件！"
            exit 1
          fi

      - name: Upload firmware and packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware_and_apk
          path: |
            openwrt/bin/targets/*/*/*.itb
            openwrt/bin/targets/*/*/*.bin
            openwrt/bin/targets/*/*/packages/
